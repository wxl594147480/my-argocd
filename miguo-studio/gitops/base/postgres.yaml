apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miguo-postgres-data
  labels:
    app: miguo-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miguo-postgres
  labels:
    app: miguo-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: miguo-postgres
  template:
    metadata:
      labels:
        app: miguo-postgres
    spec:
      containers:
        - name: postgres
          image: docker.m.daocloud.io/library/postgres:17-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: miguo-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miguo-db
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: miguo-db
                  key: database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "miguo", "-d", "miguo_studio"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: miguo-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: miguo-postgres
  labels:
    app: miguo-postgres
spec:
  selector:
    app: miguo-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
