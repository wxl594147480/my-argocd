apiVersion: v1
kind: ConfigMap
metadata:
  name: miguo-studio-config
  labels:
    app: miguo-studio
data:
  # 只放「不给也能启动」的非敏感项。缺失的项 GlobalEnv 一律回落到空字符串。
  APP_ENV: production
  ASPNETCORE_ENVIRONMENT: Production
  ENABLE_JOBS: "false"
  LOG_LEVEL: info
  PAYMENT_ENABLED: "false"
  INFERENCE_PRIORITY_ENABLED: "false"
  IS_FULLY_OPEN: "false"
  # lab 入口（影响账号中心回调、支付回调等对外地址）
  ENDPOINT_BASE_URL: http://miguo.lab
  SESSION_DOMAIN: miguo.lab
