apiVersion: apps/v1
kind: Deployment
metadata:
  name: miguo-valkey
  labels:
    app: miguo-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miguo-valkey
  template:
    metadata:
      labels:
        app: miguo-valkey
    spec:
      containers:
        - name: valkey
          image: docker.m.daocloud.io/valkey/valkey:8-alpine
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: miguo-valkey
  labels:
    app: miguo-valkey
spec:
  selector:
    app: miguo-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
