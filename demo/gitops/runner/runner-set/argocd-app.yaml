apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-arc-runner-set
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wxl594147480/my-argocd.git
    targetRevision: main
    path: demo/gitops/runner/runner-set
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
