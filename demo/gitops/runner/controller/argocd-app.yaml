apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-arc-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mangania/K8s-services.git
    targetRevision: main
    path: demo/gitops/runner/controller
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
