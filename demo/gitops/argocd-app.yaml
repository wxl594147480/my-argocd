apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 演示用的 GitOps 仓库（公开仓库，ArgoCD 可匿名 clone，不需要仓库凭据）。
    # 换成私有仓库时：改用 SSH 或在 argocd namespace 里建 type=git 的 repository secret。
    repoURL: https://github.com/wxl594147480/my-argocd.git
    targetRevision: main
    path: demo/gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
