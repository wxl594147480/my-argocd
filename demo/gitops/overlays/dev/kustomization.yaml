apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base
  - ingress.yaml

# CI 的 promote job 只改这一段：newTag 换成 sha-<commit>。
# newName 必须与 workflow 算出的镜像名一致：
#   ghcr.io/<owner>/demo-app（默认）
# 因为 runner 上没有 kustomize 时会走 sed 兜底，只替换 newTag。
images:
  - name: demo-app
    newName: ghcr.io/wxl594147480/demo-app
    newTag: sha-9052b5d

replicas:
  - name: demo-app
    count: 1
